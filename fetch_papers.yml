name: Fetch New Papers

on:
  # Roda todos os dias às 8h UTC (5h Brasília)
  schedule:
    - cron: '0 8 * * *'

  # Permite rodar manualmente pelo GitHub
  workflow_dispatch:
    inputs:
      days:
        description: 'Buscar artigos dos últimos N dias'
        required: false
        default: '7'

permissions:
  contents: write

jobs:
  fetch-papers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rodar o tracker
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
        run: |
          cd academic-tracker
          python fetch_papers.py --days ${{ github.event.inputs.days || '7' }}

      - name: Commit do banco atualizado
        run: |
          git config user.name "Paper Tracker Bot"
          git config user.email "actions@github.com"
          git add academic-tracker/papers.db
          git diff --staged --quiet || git commit -m "Atualização automática - $(date -u +%Y-%m-%d)"
          git push
